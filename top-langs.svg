<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="Most used languages">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .panel{fill:#0d1117;stroke:#30363d}
  .title{fill:#58a6ff;font-weight:700;font-size:17px}
  .label{fill:#c9d1d9;font-size:14px}
  .value{fill:#ffffff;font-weight:700;font-size:14px}
  .muted{fill:#8b949e;font-size:13px}
  .accent{fill:#58a6ff}
  .rule{stroke:#21262d}
  @media (prefers-color-scheme: light){
    .panel{fill:#ffffff;stroke:#d0d7de}
    .title{fill:#0969da} .label{fill:#1f2328} .value{fill:#000000}
    .muted{fill:#59636e} .accent{fill:#0969da} .rule{stroke:#d8dee4}
  }
  .rv{animation:glow 2.4s ease-out forwards}
  @keyframes glow{0%{filter:none}9%{filter:drop-shadow(0 0 5px currentColor)}
    26%{filter:none}100%{filter:none}}
  @media (prefers-reduced-motion: reduce){.rv{animation:none}}
  #g0{animation-delay:0.20s}
  #g1{animation-delay:0.30s}
  #g2{animation-delay:0.40s}
  #g3{animation-delay:0.50s}
  #g4{animation-delay:0.60s}
  #g5{animation-delay:0.70s}
</style>
<rect class="panel" x="1" y="1" width="358" height="198" rx="10" stroke-width="1.5"/>
<text class="title" x="24" y="36">Most Used Languages</text>
<line class="rule" x1="24" y1="50" x2="336" y2="50" stroke-width="1"/>
<clipPath id="barclip"><rect x="24" y="70" width="312" height="11" rx="5.5"/></clipPath>
<g clip-path="url(#barclip)">
<rect x="24.0" y="70" width="278.2" height="11" fill="#3572A5"/>
<rect x="301.6" y="70" width="20.3" height="11" fill="#f34b7d"/>
<rect x="321.3" y="70" width="8.7" height="11" fill="#fedf5b"/>
<rect x="329.4" y="70" width="4.3" height="11" fill="#3178c6"/>
<rect x="333.2" y="70" width="3.1" height="11" fill="#555555"/>
<rect x="335.7" y="70" width="0.9" height="11" fill="#f1e05a"/>
</g>
<g class="rv" id="g0"><circle cx="29.0" cy="100" r="5.5" fill="#3572A5"/><text class="label" x="42.0" y="104">Python</text><text class="muted" x="166.0" y="104" text-anchor="end">88.9%</text></g>
<g class="rv" id="g1"><circle cx="185.0" cy="100" r="5.5" fill="#f34b7d"/><text class="label" x="198.0" y="104">C++</text><text class="muted" x="322.0" y="104" text-anchor="end">6.3%</text></g>
<g class="rv" id="g2"><circle cx="29.0" cy="126" r="5.5" fill="#fedf5b"/><text class="label" x="42.0" y="130">Cython</text><text class="muted" x="166.0" y="130" text-anchor="end">2.6%</text></g>
<g class="rv" id="g3"><circle cx="185.0" cy="126" r="5.5" fill="#3178c6"/><text class="label" x="198.0" y="130">TypeScript</text><text class="muted" x="322.0" y="130" text-anchor="end">1.2%</text></g>
<g class="rv" id="g4"><circle cx="29.0" cy="152" r="5.5" fill="#555555"/><text class="label" x="42.0" y="156">C</text><text class="muted" x="166.0" y="156" text-anchor="end">0.8%</text></g>
<g class="rv" id="g5"><circle cx="185.0" cy="152" r="5.5" fill="#f1e05a"/><text class="label" x="198.0" y="156">JavaScript</text><text class="muted" x="322.0" y="156" text-anchor="end">0.1%</text></g>
</svg>